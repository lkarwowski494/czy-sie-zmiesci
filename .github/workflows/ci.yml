name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Matrix, i18n, Licenses & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check i18n
        run: npm run check:i18n

      - name: Check AST Test Matrix (100% across 5 categories)
        run: node scripts/test-matrix.mjs --check

      - name: Check Licenses
        run: node scripts/licenses.mjs

      - name: Verify Native iOS Config
        run: node scripts/verify-native.mjs --app-json-only

      - name: Run Jest Test Suite with Coverage
        run: npx jest --coverage --runInBand
