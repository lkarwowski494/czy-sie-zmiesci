name: E2E iOS Simulator & Maestro Flows

on:
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - '.maestro/**'
      - '.github/workflows/e2e-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Maestro E2E on iOS Simulator
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 26
        run: bash .github/scripts/select-xcode.sh 26

      - name: Install dependencies
        run: npm ci

      - name: Run Jest Maestro Flow Tests
        run: npx jest tests/maestro-flows.test.tsx --runInBand
